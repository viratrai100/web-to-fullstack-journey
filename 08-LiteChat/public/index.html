<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virat Ka Chat App</title>
</head>
<body>
    <h1>Chatting App</h1>
    <!-- <button onclick="createConnection()">Create WS Connection</button> -->

    <input type="text" id="message" placeholder="Enter Message">
    <button id="sendBtn">Send</button>

    <div id="messages"></div>

    <!-- we have to connect web socket in frontend also  -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        // function createConnection() {
        //     const socket = io();
        // }
        const socket = io();  // socket connection
        const sendBtn = document.getElementById("sendBtn");
        const messageInput = document.getElementById("message");
        const allMessages = document.getElementById("messages");

        // socket.on("message", (message) => console.log(message));
        socket.on("message", (message) => {
            const p = document.createElement("p");  // p element create karna hai
            p.innerText = message;
            allMessages.appendChild(p);  // DOM pe messages dikhane ke liye
        } );

        sendBtn.addEventListener("click", (e) => {
            const message = messageInput.value;
            console.log(message);
            socket.emit("user-message", message);
        })
    </script>
</body>
</html>
